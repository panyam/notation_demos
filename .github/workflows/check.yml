name: Check

# Every song links to its page on the notations docs site, and the link matches the file's path.
# A renamed song fails here until `node scripts/links.mjs --fix` updates its link.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: node --test scripts/links.test.mjs

      - run: node scripts/links.mjs --check
